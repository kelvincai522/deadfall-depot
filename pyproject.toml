[project]
name = "cod-level"
version = "1.0.0"
description = "AAA Call of Duty style level rendered with NVIDIA Omniverse RTX (ovrtx)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy==2.2.6",
    "ovrtx==0.4.0.346409",
    "ovstage==0.1.0.346039",
    "pillow==12.1.1",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
